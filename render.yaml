services:
  - type: web
    name: lensly-content-engine
    runtime: docker
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: postgres
      - key: DATABASE_SSL
        value: true
      - key: X_PUBLISHING_ENABLED
        value: false
      - key: X_DRY_RUN
        value: true
      - key: MAX_POSTS_PER_RUN
        value: 1
      - key: TIMEZONE
        value: Africa/Lagos
      - key: DATABASE_URL
        fromDatabase:
          name: lensly-db
          property: connectionString
